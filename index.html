<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee App Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --brand-primary: #33cc00; /* Custom Metronet Green Accent */
            --brand-primary-hover: #29a300;
            --brand-purple: #7B2CBF; /* Custom Metronet Brand Purple */
            --brand-dark: #0a0412; /* Deep Black-Purple base canvas */
            --brand-dark-card: #150924; /* Elevated Plum-Purple card background */
            --apple: #ffffff;
            --apple-text: #0a0412;
            --android: #3ddc84;
            --android-text: #073013;
            --bg: #0a0412; 
            --text: #f9fafb;
            --text-muted: #d4bfff; /* Soft purple-tinted scannable prose text */
            --border: #2c134d; /* Indigo-purple micro borders */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 3rem 1rem; background-image: radial-gradient(circle at top right, rgba(51, 204, 0, 0.07), transparent 45%), radial-gradient(circle at bottom left, rgba(123, 44, 191, 0.09), transparent 50%); }
        .container { max-width: 800px; margin: 0 auto; }
        
        /* Interactive Brand Header */
        header { text-align: center; margin-bottom: 2.5rem; display: flex; flex-direction: column; align-items: center; }
        .logo-container { margin-bottom: 1rem; max-width: 320px; width: 100%; height: auto; display: flex; justify-content: center; align-items: center; }
        .logo-img { width: 100%; height: auto; object-fit: contain; }
        h1 { font-size: 2.25rem; font-weight: 800; margin-bottom: 0.5rem; letter-spacing: -0.025em; background: linear-gradient(to right, #ffffff, #e0aaff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-top: 0.5rem; }
        p.subtitle { color: #d4bfff; font-size: 1.05rem; max-width: 500px; line-height: 1.5; opacity: 0.9; }
        p.subtitle strong { color: var(--brand-primary); }

        /* Progress Dashboard Box */
        .progress-container { background: var(--brand-dark-card); padding: 1.5rem; border-radius: 16px; border: 1px solid var(--border); margin-bottom: 2.5rem; box-shadow: 0 4px 20px -2px rgba(0,0,0,0.4); position: relative; overflow: hidden; }
        .progress-container::before { content: ''; position: absolute; top: 0; left: 0; width: 4px; height: 100%; background: var(--brand-purple); }
        .progress-text { display: flex; justify-content: space-between; margin-bottom: 0.75rem; font-weight: 700; font-size: 0.95rem; text-transform: uppercase; letter-spacing: 0.05em; color: #f3e8ff; }
        .progress-bar-bg { background: rgba(255,255,255,0.04); height: 12px; border-radius: 6px; overflow: hidden; }
        .progress-bar-fill { background: linear-gradient(90deg, var(--brand-primary), #51e2f5); height: 100%; width: 0%; transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1); }

        /* Dynamic Mode Switching Tabs */
        .filters { display: flex; gap: 0.75rem; margin-bottom: 2rem; background: rgba(21, 9, 36, 0.8); padding: 0.4rem; border-radius: 30px; border: 1px solid var(--border); width: max-content; }
        .filter-btn { background: transparent; border: none; padding: 0.6rem 1.5rem; border-radius: 25px; cursor: pointer; font-weight: 600; font-size: 0.9rem; color: #e0aaff; transition: all 0.25s ease; }
        .filter-btn:hover { color: white; }
        .filter-btn.active { background: var(--brand-purple); color: white; box-shadow: 0 4px 12px rgba(123, 44, 191, 0.4); }

        /* Refreshed List Shell */
        .apps-list { display: flex; flex-direction: column; gap: 1.25rem; }
        .app-card { background: var(--brand-dark-card); border: 1px solid var(--border); padding: 1.5rem; border-radius: 16px; display: flex; align-items: flex-start; gap: 1.25rem; transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s; position: relative; }
        .app-card:hover { transform: translateY(-2px); border-color: #5a189a; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.5); }
        
        /* Completion States matched to True Green Theme */
        .app-card.checked { border-color: var(--brand-primary); background-image: linear-gradient(145deg, var(--brand-dark-card), rgba(51, 204, 0, 0.02)); }
        .app-card.checked::after { content: '✓'; position: absolute; top: 1.5rem; right: 1.5rem; background: rgba(51, 204, 0, 0.15); color: var(--brand-primary); width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.8rem; border: 1px solid rgba(51, 204, 0, 0.3); }

        /* Checkbox Custom styling */
        .checkbox-wrapper { padding-top: 0.25rem; }
        .checkbox-wrapper input { width: 1.35rem; height: 1.35rem; cursor: pointer; accent-color: var(--brand-primary); border-radius: 6px; }

        .app-details { flex-grow: 1; padding-right: 2rem; }
        .app-title { font-size: 1.2rem; font-weight: 700; margin-bottom: 0.35rem; display: flex; align-items: center; gap: 0.6rem; color: #ffffff; }
        
        /* Modernized Badges */
        .badge { font-size: 0.7rem; padding: 0.25rem 0.6rem; border-radius: 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
        .badge.required { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        .badge.dept { background: rgba(123, 44, 191, 0.2); color: #e0aaff; border: 1px solid rgba(123, 44, 191, 0.3); }
        
        .app-desc { color: #e0aaff; font-size: 0.95rem; margin-bottom: 1rem; line-height: 1.4; opacity: 0.85; }
        .app-instructions { font-size: 0.88rem; background: rgba(10, 4, 18, 0.6); padding: 0.75rem 1rem; border-radius: 10px; margin-bottom: 1rem; border-left: 3px solid var(--brand-purple); color: #f3e8ff; }

        /* Re-engineered Link Hub Controls */
        .btn-group { display: flex; flex-wrap: wrap; gap: 0.6rem; margin-top: 0.5rem; }
        .btn-link { display: inline-flex; align-items: center; gap: 0.5rem; background: rgba(255,255,255,0.04); color: #ffffff; border: 1px solid var(--border); text-decoration: none; padding: 0.6rem 1.2rem; border-radius: 8px; font-size: 0.85rem; font-weight: 600; transition: all 0.2s ease; cursor: pointer; }
        .btn-link:hover { background: rgba(123, 44, 191, 0.15); border-color: var(--brand-purple); }
        
        /* Specific Native Sub-styles */
        .btn-link.apple { background: var(--apple); color: var(--apple-text); border: none; }
        .btn-link.apple:hover { background: #e5e7eb; }
        .btn-link.android { background: var(--android); color: var(--android-text); border: none; }
        .btn-link.android:hover { background: #34c777; }
        
        /* Device Auto-Target Suggestion Rings */
        .btn-link.detected { outline: 2px solid var(--brand-primary); outline-offset: 2px; }
        .btn-link.detected::after { content: "•"; color: currentColor; font-size: 1.2rem; margin-left: 2px; line-height: 0; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="logo-container">
            <img class="logo-img" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/svg' viewBox='0 0 540 160' width='540' height='160'><style>text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: bold; }</style><g transform='translate(10,10)'><text x='0' y='80' font-size='95' fill='%2333cc00' letter-spacing='-4'>metr<tspan fill='%237B2CBF'>onet</tspan></text><text x='215' y='125' font-size='32' fill='%237B2CBF' letter-spacing='1.5' font-weight='normal'>love your internet</text></g></svg>" alt="Metronet Logo">
        </div>
        <h1>Your Workspace Setup</h1>
        <p class="subtitle">Download tools, initialize accounts, and verify your configurations to activate your field environment.</p>
    </header>

    <div class="progress-container">
        <div class="progress-text">
            <span>Onboarding Checklist Progress</span>
            <span id="progress-count">0 of 0 completed</span>
        </div>
        <div class="progress-bar-bg">
            <div id="progress-fill" class="progress-bar-fill"></div>
        </div>
    </div>

    <div class="filters">
        <button class="filter-btn active" id="btn-All" onclick="filterDept('All')">All</button>
        <button class="filter-btn" id="btn-Apps" onclick="filterDept('Apps')">Apps</button>
        <button class="filter-btn" id="btn-Websites" onclick="filterDept('Websites')">Websites</button>
    </div>

    <div class="apps-list" id="apps-container"></div>
</div>

<script>
    const appsData = [
        {
            name: "AirPort Utility",
            dept: "Apps",
            required: true,
            desc: "Wifi scanner utility app.",
            instructions: "Go to device settings, find Apps, tap AirPort Utility, and toggle on 'Wi-Fi Scanner'.",
            appleUrl: "https://apps.apple.com/app/id427276530",
            androidUrl: "https://play.google.com/store/apps/details?id=com.ubnt.usurvey&hl=en" 
        },
        {
            name: "Fleetio Go",
            dept: "Apps",
            required: true,
            desc: "Fleet Management tracking and updates portal.",
            instructions: "Follow the setup instructions in the email that was sent to you.",
            appleUrl: "https://apps.apple.com/app/id1100421418",
            androidUrl: "https://play.google.com/store/search?q=fleetio+go&c=apps&hl=en"
        },
        {
            name: "Oracle",
            dept: "Apps",
            required: true,
            desc: "Clock in, view field jobs, and clock out.",
            instructions: "We will assist you with account setup on your first day.",
            appleUrl: "https://apps.apple.com/app/id1363168467",
            androidUrl: "https://play.google.com/store/apps/details?id=com.oracle.ofsc&hl=en"
        },
        {
            name: "Outlook",
            dept: "Apps",
            required: true,
            desc: "Corporate email access client.",
            instructions: "Log in with your provided workspace account.",
            appleUrl: "https://apps.apple.com/app/id951937596",
            androidUrl: "https://play.google.com/store/search?q=outlook&c=apps&hl=en"
        },
        {
            name: "Teams",
            dept: "Apps",
            required: true,
            desc: "Company communications and video check-ins.",
            instructions: "Log in with your provided workspace account.",
            appleUrl: "https://apps.apple.com/app/id1113153706",
            androidUrl: "https://play.google.com/store/search?q=teams&c=apps&hl=en"
        },
        {
            name: "T-Mobile Fiber",
            dept: "Apps",
            required: true,
            desc: "Router Configuration Tool.",
            instructions: "You will be trained on how to use this tool out in the field.",
            appleUrl: "https://apps.apple.com/app/id6752574293",
            androidUrl: "https://play.google.com/store/search?q=t-mobile%20eero&c=apps&hl=en"
        },
        {
            name: "Timestamp Camera",
            dept: "Apps",
            required: true,
            desc: "Camera utility tracking real-time layout location updates.",
            instructions: "Take a test picture once installed to ensure correct overlay parameters.",
            appleUrl: "https://apps.apple.com/app/id1297201432",
            androidUrl: "https://play.google.com/store/search?q=timestamp&c=apps&hl=en"
        },
        {
            name: "SpeedTest-Ookla",
            dept: "Apps",
            required: true,
            desc: "Network connection verification diagnostics.",
            instructions: "Connect directly to the client router and initiate verification tests.",
            appleUrl: "https://apps.apple.com/app/id300704847",
            androidUrl: "https://play.google.com/store/apps/details?id=org.zwanoo.android.speedtest&hl=en&pli=1"
        },
        {
            name: "UKG Pro",
            dept: "Apps",
            required: true,
            desc: "Access your paystubs, time-off requests, and HR documentation.",
            instructions: "Log in with your provided workspace account.",
            appleUrl: "https://apps.apple.com/us/app/ukg-pro/id6444849909",
            androidUrl: "https://play.google.com/store/search?q=ukg&c=apps&hl=en"
        },
        {
            name: "UKG Learning",
            dept: "Apps",
            required: true,
            desc: "Corporate training and compliance platform application.",
            instructions: "Log in with your provided workspace account.",
            appleUrl: "https://apps.apple.com/app/id1217651900",
            androidUrl: "https://play.google.com/store/search?q=ukg+learning&c=apps&hl=en"
        },
        {
            name: "NOC",
            dept: "Websites",
            required: true,
            desc: "Infrastructure maps mapping system portals.",
            instructions: "Enter your designated field credentials.",
            url: "https://esri.qservco.com/portal/apps/webappviewer/index.html?id=1493c6564b36486da7d3645af289ca95" 
        },
        {
            name: "FTA",
            dept: "Websites",
            required: true,
            desc: "Field Tech Admin core dashboards tracker.",
            instructions: "Provide your authentication credentials to enter.",
            url: "https://webapps.metronet.com/fta/dashboard?iid=NTUwMDQwMzgyMjY4"
        },
        {
            name: "Install Drop Ont",
            dept: "Websites",
            required: false,
            desc: "Form to submit a temporary drop fix configuration.",
            instructions: "Follow the sequential on-screen document prompts.",
            url: "https://app.smartsheet.com/b/form/0d5b0d79e0ca49f78db0d03049c67011"
        },
        {
            name: "GeoTab",
            dept: "Websites",
            required: true,
            desc: "Telemetry tracking portal to manage everything about your field truck.",
            instructions: "Use your corporate email, then input 'metro2020' for the initial password.",
            url: "https://www.geotab.com/mygeotab-login/"
        },
        {
            name: "Time-Off",
            dept: "Websites",
            required: false,
            desc: "Internal scheduling Time Off Calendar form.",
            instructions: "Log and submit your requested out-of-office blocks.",
            url: "https://app.smartsheet.com/b/form/c5dc13b063a7423ebc11085819f7ae36"
        },
        {
            name: "Spokeo",
            dept: "Websites",
            required: false,
            desc: "Real estate lookups tool for verifying home square footage metrics.",
            instructions: "Input the specific active residential service address.",
            url: "https://www.spokeo.com/"
        }
    ];

    let currentFilter = 'All';

    function getDeviceOS() {
        const userAgent = navigator.userAgent || navigator.vendor || window.opera;
        if (/android/i.test(userAgent)) return "Android";
        if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) return "iOS";
        return "Desktop";
    }

    function renderApps() {
        const container = document.getElementById('apps-container');
        container.innerHTML = '';
        const userOS = getDeviceOS();

        const filtered = appsData.filter(app => currentFilter === 'All' || app.dept === currentFilter);

        filtered.forEach((app, index) => {
            const isChecked = localStorage.getItem(`app-${app.name}`) === 'true';
            
            const card = document.createElement('div');
            card.className = `app-card ${isChecked ? 'checked' : ''}`;
            card.id = `card-${index}`;

            let buttonsHtml = '<div class="btn-group">';
            
            if (app.appleUrl) {
                const isDetected = (userOS === "iOS");
                buttonsHtml += `<a href="${app.appleUrl}" target="_blank" class="btn-link apple ${isDetected ? 'detected' : ''}" onclick="smartCheck('${app.name}', ${index})">Apple Store</a>`;
            }
            if (app.androidUrl) {
                const isDetected = (userOS === "Android");
                buttonsHtml += `<a href="${app.androidUrl}" target="_blank" class="btn-link android ${isDetected ? 'detected' : ''}" onclick="smartCheck('${app.name}', ${index})">Google Play</a>`;
            }
            if (app.url) {
                buttonsHtml += `<a href="${app.url}" target="_blank" class="btn-link" onclick="smartCheck('${app.name}', ${index})">Launch Portal Site &rarr;</a>`;
            }
            
            buttonsHtml += '</div>';

            card.innerHTML = `
                <div class="checkbox-wrapper">
                    <input type="checkbox" id="check-${index}" ${isChecked ? 'checked' : ''} onchange="toggleApp('${app.name}', ${index})">
                </div>
                <div class="app-details">
                    <div class="app-title">
                        ${app.name}
                        ${app.required ? '<span class="badge required">Required</span>' : ''}
                        <span class="badge dept">${app.dept}</span>
                    </div>
                    <div class="app-desc">${app.desc}</div>
                    ${app.instructions ? `<div class="app-instructions"><strong>Setup:</strong> ${app.instructions}</div>` : ''}
                    ${buttonsHtml}
                </div>
            `;
            container.appendChild(card);
        });

        updateProgress();
    }

    function filterDept(dept) {
        currentFilter = dept;
        document.getElementById('btn-All').classList.remove('active');
        document.getElementById('btn-Apps').classList.remove('active');
        document.getElementById('btn-Websites').classList.remove('active');
        document.getElementById(`btn-${dept}`).classList.add('active');
        renderApps();
    }

    function smartCheck(appName, index) {
        const checkbox = document.getElementById(`check-${index}`);
        if(checkbox && !checkbox.checked) {
            checkbox.checked = true;
            toggleApp(appName, index);
        }
    }

    function toggleApp(appName, index) {
        const checkbox = document.getElementById(`check-${index}`);
        const card = document.getElementById(`card-${index}`);
        
        localStorage.setItem(`app-${appName}`, checkbox.checked);
        if (checkbox.checked) {
            card.classList.add('checked');
        } else {
            card.classList.remove('checked');
        }
        updateProgress();
    }

    function updateProgress() {
        const total = appsData.length;
        let completed = 0;
        
        appsData.forEach(app => {
            if (localStorage.getItem(`app-${app.name}`) === 'true') completed++;
        });

        const percent = total > 0 ? (completed / total) * 100 : 0;
        document.getElementById('progress-fill').style.width = `${percent}%`;
        document.getElementById('progress-count').innerText = `${completed} of ${total} completed`;

        if (completed === total && total > 0) {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }
    }

    renderApps();
</script>

</body>
</html>
